[package]
name = "tuta-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "GPL-3.0-only"

[dependencies]
tuta-sdk = { git = "https://github.com/tutao/tutanota.git", rev = "5dba96493532804ebd5a541024aa217ca3b7874d", features = ["net"] }
crypto-primitives = { git = "https://github.com/tutao/tutanota.git", rev = "5dba96493532804ebd5a541024aa217ca3b7874d", package = "crypto-primitives", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
rpassword = "7"
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust", "apple-native", "windows-native"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
mail-builder = "2"
mail-parser = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rcgen = "0.13"
rustls-pemfile = "2"
futures-util = "0.3"
urlencoding = "2"
quick-xml = "0.41.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
